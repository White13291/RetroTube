services:
  retrotube:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${RETROTUBE_PORT:-8080}:8765"
    environment:
      RETROTUBE_CACHE_DIR: /data
      RETROTUBE_FRONTEND_ORIGIN: https://white13291.github.io
      RETROTUBE_MAX_DURATION: "1800"
      RETROTUBE_MAX_ACTIVE_JOBS: "1"
      RETROTUBE_MAX_QUEUE: "4"
      RETROTUBE_MAX_CACHE_GB: "3"
    volumes:
      - retrotube-cache:/data
    mem_limit: 1536m
volumes:
  retrotube-cache:
